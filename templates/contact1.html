<!doctype html>
<html lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="The Den Gym Contact Page" />
    <meta name="keywords" content="Gym, Fitness, Contact" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>The Den Gym | Contact</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/logo.jpg') }}"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Muli:300,400,500,600,700,800,900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Oswald:300,400,500,600,700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/font-awesome.min.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/slicknav.min.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <style>
      body {
        background: #000;
        color: #fff;
        font-family: "Muli", sans-serif;
        overflow-x: hidden;
      }

      a:hover {
        text-decoration: none;
      }

      .row {
        margin-left: 0;
        margin-right: 0;
      }

      /* =========================
       HEADER
    ========================== */

      .header-section {
        position: absolute;
        width: 100%;
        top: 0;
        left: 0;
        z-index: 99999;
        padding: 18px 40px;
        background: transparent;
      }

      .header-section .container-fluid {
        padding-left: 0;
        padding-right: 0;
      }

      .header-section .row {
        align-items: center;
      }

      /* =========================
       LOGO
    ========================== */

      .logo {
        position: relative;
        z-index: 999999;
      }

      .logo img {
        width: 110px;
        max-width: 100%;
        display: block;
      }

      /* =========================
       NAVIGATION
    ========================== */

      .nav-menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: center;
      }

      .nav-menu ul li {
        display: inline-block;
        margin: 0 18px;
      }

      .nav-menu ul li a {
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-transform: uppercase;
        transition: 0.3s;
      }

      .nav-menu ul li.active a,
      .nav-menu ul li a:hover {
        color: #f36100;
      }

      /* =========================
       SOCIAL
    ========================== */

      .top-option {
        text-align: right;
      }

      .top-option a {
        color: #ffffff;
        font-size: 18px;
        margin-left: 15px;
        transition: 0.3s;
      }

      .top-option a:hover {
        color: #f36100;
      }

      /* =========================
       MOBILE MENU
    ========================== */

      .slicknav_menu {
        display: none;
      }

      /* =========================
       HERO
    ========================== */

      .breadcrumb-section {
        height: 100vh;
        background-image: url('{{ url_for("static", filename="img/hero/hero-1.png") }}');
        background-size: cover;
        background-position: 68% center;
        background-repeat: no-repeat;
        position: relative;

        display: flex;
        align-items: center;
      }

      .breadcrumb-section::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
      }

      .breadcrumb-text {
        position: relative;
        z-index: 2;
        padding-left: 80px;
      }

      .breadcrumb-text span {
        color: #f36100;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      .breadcrumb-text h2 {
        color: #fff;
        font-size: 80px;
        font-weight: 700;
        line-height: 90px;
        margin-top: 20px;
        margin-bottom: 20px;
      }

      .bt-option a,
      .bt-option span {
        font-size: 18px;
        color: #fff;
        font-weight: 600;
      }

      .bt-option span {
        color: #f36100;
      }

      /* =========================
       CONTACT SECTION
    ========================== */

      .contact-section {
        padding: 100px 0;
        background: #111111;
      }

      .section-title {
        margin-bottom: 40px;
      }

      .section-title span {
        color: #f36100;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .section-title h2 {
        color: #fff;
        font-size: 48px;
        font-weight: 700;
        margin-top: 15px;
      }

      .contact-info .ci-item {
        margin-bottom: 35px;
      }

      .contact-info .ci-item i {
        font-size: 28px;
        color: #f36100;
        margin-bottom: 15px;
      }

      .contact-info .ci-item p {
        color: #c4c4c4;
        line-height: 28px;
        font-size: 16px;
        margin: 0;
      }

      .contact-form input,
      .contact-form textarea {
        width: 100%;
        background: #1b1b1b;
        border: none;
        border-radius: 12px;
        padding: 16px 20px;
        color: #fff;
        font-size: 15px;
        margin-bottom: 25px;
      }

      .contact-form textarea {
        height: 180px;
        resize: none;
      }

      .contact-form input:focus,
      .contact-form textarea:focus {
        outline: none;
        box-shadow: none;
      }

      .primary-btn {
        display: inline-block;
        background: #f36100;
        color: #fff;
        padding: 14px 34px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        border: none;
        transition: 0.3s;
        border-radius: 5px;
        cursor: pointer;
      }

      .primary-btn:hover {
        background: #ff7b29;
        color: #fff;
      }

      /* =========================
       FOOTER
    ========================== */

      .footer-section {
        background: #000;
        padding: 35px 0;
        text-align: center;
      }

      .footer-section p {
        margin: 0;
        color: #999;
        font-size: 16px;
      }

      /* =========================
       MOBILE RESPONSIVE
    ========================== */

      @media only screen and (max-width: 767px) {
        body {
          overflow-x: hidden;
          background: #000 !important;
        }

        .header-section {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          background: transparent !important;
          padding: 18px 20px;
          z-index: 99999;
        }

        .header-section .container-fluid {
          padding: 0;
          background: transparent !important;
        }

        .header-section .row {
          background: transparent !important;
          margin: 0;
          align-items: center;
        }

        .nav-menu {
          display: none !important;
        }

        .top-option {
          display: none !important;
        }

        .slicknav_menu {
          display: block !important;
          background: transparent !important;
          position: absolute;
          top: 20px;
          right: 20px;
          z-index: 999999;
          padding: 0;
        }

        .slicknav_btn {
          margin: 0;
          background: #f36100 !important;
          border-radius: 4px;
          border: none !important;
        }

        .slicknav_nav {
          background: #000 !important;
          width: 220px;
          margin-top: 12px;
          border-radius: 6px;
          padding: 10px 15px;
          border: 1px solid #111;
        }

        .slicknav_nav ul,
        .slicknav_nav li,
        .slicknav_nav a {
          background: #000 !important;
        }

        .slicknav_nav a {
          color: #ffffff !important;
          font-size: 14px;
          font-weight: 600;
          text-transform: uppercase;
          padding: 10px 0;
        }

        .slicknav_nav a:hover {
          background: #111 !important;
          color: #f36100 !important;
        }

        .breadcrumb-section {
          height: 100vh;
          background-size: cover;
          background-position: 68% center;
          justify-content: flex-start;
          align-items: center;
          padding: 0 20px;
        }

        .breadcrumb-text {
          padding-left: 0;
          width: 60%;
          margin-top: 80px;
        }

        .breadcrumb-text span {
          font-size: 12px;
          letter-spacing: 2px;
        }

        .breadcrumb-text h2 {
          font-size: 40px;
          line-height: 48px;
          margin-top: 10px;
        }

        .bt-option a,
        .bt-option span {
          font-size: 14px;
        }

        .section-title h2 {
          font-size: 32px;
        }

        .contact-section {
          padding: 70px 0 40px;
        }

        .contact-info {
          margin-bottom: 50px;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header class="header-section">
      <div class="container-fluid">
        <div class="row">
          <!-- LOGO -->
          <div class="col-lg-3 col-6">
            <div class="logo">
              <a href="/">
                <img
                  src="{{ url_for('static', filename='img/logo.jpg') }}"
                  alt="The Den Gym Logo"
                />
              </a>
            </div>
          </div>

          <!-- NAVIGATION -->
          <div class="col-lg-6">
            <nav class="nav-menu">
              <ul>
                <li><a href="/">Home</a></li>

                <li><a href="/about">About Us</a></li>

                <li><a href="/services">Services</a></li>

                <li><a href="/team">Our Team</a></li>

                <li class="active">
                  <a href="/contact">Contact</a>
                </li>
              </ul>
            </nav>
          </div>

          <!-- SOCIAL -->
          <div class="col-lg-3">
            <div class="top-option">
              <a
                href="https://www.facebook.com/profile.php?id=61577981671047"
                target="_blank"
              >
                <i class="fa fa-facebook"></i>
              </a>

              <a href="https://www.instagram.com/the_den_gym_" target="_blank">
                <i class="fa fa-instagram"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- HERO -->
    <section class="breadcrumb-section">
      <div class="breadcrumb-text">
        <span>GET IN TOUCH</span>

        <h2>CONTACT US</h2>

        <div class="bt-option">
          <a href="/">Home</a>
          <span> › Contact</span>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="contact-section">
      <div class="container">
        <div class="row">
          <!-- CONTACT INFO -->
          <div class="col-lg-5">
            <div class="section-title">
              <span>Contact Us</span>

              <h2>Get In Touch</h2>
            </div>

            <div class="contact-info">
              <div class="ci-item">
                <i class="fa fa-map-marker"></i>

                <p>
                  2nd Floor, Hindustan House, Parge Nagar Road, Kondhwa, Pune,
                  Maharashtra 411048
                </p>
              </div>

              <div class="ci-item">
                <i class="fa fa-phone"></i>

                <p>+91 7387381595</p>
              </div>

              <div class="ci-item">
                <i class="fa fa-envelope"></i>

                <p>thedengym0@gmail.com</p>
              </div>
            </div>
          </div>

          <!-- CONTACT FORM -->
          <div class="col-lg-7">
            <form action="/submit_form" method="POST" class="contact-form">
              <input
                type="text"
                name="fullname"
                placeholder="Your Name"
                required
              />

              <input
                type="tel"
                name="phone"
                placeholder="Phone Number"
                required
              />

              <textarea
                name="message"
                placeholder="Message"
                required
              ></textarea>

              <button type="submit" class="primary-btn">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-section">
      <div class="container">
        <p>
          ©
          <script>
            document.write(new Date().getFullYear());
          </script>
          The Den Gym | Train Hard • Stay Strong 💪
        </p>
      </div>
    </footer>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>

    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

    <script src="{{ url_for('static', filename='js/jquery.slicknav.js') }}"></script>

    <!-- MOBILE MENU -->
    <script>
      $(document).ready(function () {
        if ($(window).width() <= 767) {
          $(".nav-menu").slicknav({
            prependTo: ".header-section",
            label: "",
          });
        }
      });
    </script>
  </body>
</html>
